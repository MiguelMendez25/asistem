<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asistem</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Asistem</h1>

        <div class="informacion-clase">

            <div>
                <strong>Docente</strong>
                <p>Nombre del docente</p>
            </div>

            <div>
                <strong>Curso</strong>

                <select id="curso">
                    <option>11°1</option>
                    <option>11°2</option>
                    <option selected>11°3</option>
                    <option>11°4</option>
                    <option>11°5</option>
                </select>
            </div>

            <div>
                <strong>Fecha</strong>
                <p id="fecha"></p>
            </div>

        </div>

    </header>


    <main>

        <!-- RESUMEN -->

        <section id="resumen" class="resumen" aria-label="Resumen de asistencia">

            <div class="tarjeta">
                <span>Total</span>
                <strong id="total">0</strong>
            </div>

            <!-- Las tarjetas de los estados se crean desde script.js. -->

        </section>


        <!-- HERRAMIENTAS -->

        <section class="herramientas">

            <div class="consultas">
                <input
                    type="text"
                    id="busqueda"
                    aria-label="Buscar estudiante"
                    placeholder="🔎 Buscar estudiante..."
                >

                <select id="filtro" aria-label="Filtrar por estado de asistencia">
                    <option value="todos">Todos</option>
                    <!-- Las opciones de los estados se crean desde script.js. -->
                </select>
            </div>

            <div class="acciones-masivas">
                <button type="button" id="marcar-todos" aria-haspopup="menu"
                    aria-expanded="false" aria-controls="menu-masivo">
                    Marcar todos como… <span aria-hidden="true">▾</span>
                </button>
                <div id="menu-masivo" class="menu-masivo" role="menu"
                    aria-labelledby="marcar-todos" hidden>
                    <!-- Las cinco acciones se crean desde script.js. -->
                </div>
            </div>

        </section>


        <!-- AVISO -->

        <div id="aviso" class="aviso">
            ⚠️ Hay estudiantes sin registrar.
        </div>


        <!-- LISTA -->

        <section class="lista-asistencia">

            <div class="cabecera-lista">
                <h2>Lista de estudiantes</h2>
                <span id="cantidad-visible" aria-live="polite"></span>
            </div>

            <div class="tabla-contenedor">
            <table>

                <thead>

                    <tr>
                        <th scope="col" class="numero-estudiante">#</th>
                        <th scope="col">Estudiante</th>
                        <th scope="col" class="columna-acciones">Acciones</th>
                    </tr>

                </thead>


                <tbody id="lista-estudiantes">

                </tbody>

            </table>
            </div>

            <p id="sin-coincidencias" hidden>
                No hay estudiantes que coincidan con la búsqueda y el filtro
            </p>

        </section>


        <!-- GUARDAR -->

        <section class="guardar">

            <button id="guardar">
                ✓ Guardar asistencia
            </button>

        </section>

    </main>

    <dialog id="confirmacion-masiva" aria-labelledby="titulo-confirmacion"
        aria-describedby="mensaje-confirmacion ayuda-confirmacion">
        <div class="contenido-modal">
            <h2 id="titulo-confirmacion"></h2>
            <p id="mensaje-confirmacion"></p>
            <p id="ayuda-confirmacion">Después podrás modificar individualmente las excepciones.</p>
            <div class="botones-modal">
                <button type="button" id="cancelar-masiva" autofocus>Cancelar</button>
                <button type="button" id="confirmar-masiva" disabled>Marcar todos</button>
            </div>
        </div>
    </dialog>

    <div id="notificacion" class="notificacion" role="status" aria-live="polite" aria-atomic="true"></div>


    <script src="script.js"></script>

</body>

</html>
